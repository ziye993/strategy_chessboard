<!DOCTYPE html>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3B82F6',
                        secondary: '#10B981',
                        obstacle: '#EF4444',
                        goal: '#F59E0B',
                        agent: '#8B5CF6',
                        grid: '#E5E7EB',

    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto {
                content-visibility: auto;
            }
            .cell-hover {
                @apply transition-all duration-200 hover:shadow-md hover:scale-[1.02];
            }
            .btn-primary {
                @apply bg-primary hover:bg-primary/90 text-white font-medium py-2 px-4 rounded-lg transition-all duration-200 transform hover:scale-105 active:scale-95 shadow-md;
            }
            .btn-secondary {
                @apply bg-secondary hover:bg-secondary/90 text-white font-medium py-2 px-4 rounded-lg transition-all duration-200 transform hover:scale-105 active:scale-95 shadow-md;
            }
            .card {
                @apply bg-white rounded-xl shadow-lg p-6 transition-all duration-300 hover:shadow-xl;
            }
            .animate-value {
                transition: all 0.5s ease-out;
            }

    </style>
</head>
<body class="bg-gray-50 font-inter min-h-screen">
    <div class="container mx-auto px-4 py-8 max-w-6xl">
        <header class="mb-8 text-center">
            <h1 class="text-[clamp(2rem,5vw,3rem)] font-bold text-gray-800 mb-2">Q-Learning 算法可视化</h1>
            <p class="text-gray-600 max-w-2xl mx-auto">探索强化学习的基础 - Q-Learning 算法如何学习最优路径</p>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- 控制面板 -->
            <div class="card lg:col-span-1">
                <h2 class="text-xl font-semibold mb-4 text-gray-800 flex items-center">
                    <i class="fa fa-sliders mr-2 text-primary"></i>控制面板
                </h2>
                
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">网格大小</label>
                        <input type="range" id="gridSize" min="3" max="10" value="5" 
                               class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-primary">
                        <div class="flex justify-between text-xs text-gray-500 mt-1">
                            <span>3×3</span>
                            <span id="gridSizeValue">5×5</span>
                            <span>10×10</span>
                        </div>
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">学习率 (α)</label>
                        <input type="range" id="learningRate" min="0.01" max="1" step="0.01" value="0.1" 
                               class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-primary">
                        <span id="learningRateValue" class="text-sm text-gray-600">0.1</span>
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">折扣因子 (γ)</label>
                        <input type="range" id="discountFactor" min="0.01" max="1" step="0.01" value="0.9" 
                               class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-primary">
                        <span id="discountFactorValue" class="text-sm text-gray-600">0.9</span>
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">探索率 (ε)</label>
                        <input type="range" id="epsilon" min="0" max="1" step="0.01" value="1" 
                               class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-primary">
                        <span id="epsilonValue" class="text-sm text-gray-600">1.0</span>
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">探索衰减率</label>
                        <input type="range" id="epsilonDecay" min="0.9" max="0.999" step="0.001" value="0.995" 
                               class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-primary">
                        <span id="epsilonDecayValue" class="text-sm text-gray-600">0.995</span>
                    </div>
                    
                    <div class="pt-2">
                        <label class="block text-sm font-medium text-gray-700 mb-2">训练设置</label>
                        <div class="flex items-center space-x-2">
                            <input type="number" id="episodes" value="100" min="1" max="10000" 
                                   class="w-20 px-3 py-1 border border-gray-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-primary/50">
                            <span class="text-sm text-gray-600">回合</span>
                        </div>
                    </div>
                    
                    <div class="pt-2 flex space-x-3">
                        <button id="trainBtn" class="btn-primary flex-1 flex items-center justify-center">
                            <i class="fa fa-play mr-2"></i>开始训练
                        </button>
                        <button id="resetBtn" class="bg-gray-600 hover:bg-gray-700 text-white font-medium py-2 px-4 rounded-lg transition-all duration-200">
                            <i class="fa fa-refresh"></i>
                        </button>
                    </div>
                </div>
                
                <div class="mt-6 pt-6 border-t border-gray-200">
                    <h3 class="text-lg font-medium text-gray-800 mb-3">训练状态</h3>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <p class="text-sm text-gray-500">当前回合</p>
                            <p id="currentEpisode" class="text-xl font-semibold text-gray-800">0</p>
                        </div>
                        <div>
                            <p class="text-sm text-gray-500">当前奖励</p>
                            <p id="currentReward" class="text-xl font-semibold text-gray-800">0</p>
                        </div>
                        <div>
                            <p class="text-sm text-gray-500">总步数</p>
                            <p id="totalSteps" class="text-xl font-semibold text-gray-800">0</p>
                        </div>
                        <div>
                            <p class="text-sm text-gray-500">探索率</p>
                            <p id="currentEpsilon" class="text-xl font-semibold text-gray-800">1.00</p>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- 网格世界和Q表 -->
            <div class="lg:col-span-2 space-y-8">
                <!-- 网格世界 -->
                <div class="card">
                    <h2 class="text-xl font-semibold mb-4 text-gray-800 flex items-center">
                        <i class="fa fa-th mr-2 text-primary"></i>网格世界
                    </h2>
                    <div class="flex justify-center">
                        <div id="gridContainer" class="relative"></div>
                    </div>
                </div>
                
                <!-- 训练统计 -->
                <div class="card">
                    <h2 class="text-xl font-semibold mb-4 text-gray-800 flex items-center">
                        <i class="fa fa-chart-line mr-2 text-primary"></i>训练统计
                    </h2>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <h3 class="text-sm font-medium text-gray-600 mb-2">累积奖励</h3>
                            <div id="rewardChart" class="w-full h-64"></div>
                        </div>
                        <div>
                            <h3 class="text-sm font-medium text-gray-600 mb-2">每回合步数</h3>
                            <div id="stepsChart" class="w-full h-64"></div>
                        </div>
                    </div>
                </div>
                
                <!-- Q表可视化 -->
                <div class="card">
                    <h2 class="text-xl font-semibold mb-4 text-gray-800 flex items-center">
                        <i class="fa fa-table mr-2 text-primary"></i>Q表可视化
                    </h2>
                    <div id="qTableContainer" class="overflow-x-auto"></div>
                </div>
            </div>
        </div>
        
        <footer class="mt-12 text-center text-gray-500 text-sm">
            <p>Q-Learning 算法可视化演示 | 强化学习基础</p>
        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script>
    <script>
        // 网格世界环境
        class GridWorld {
            constructor(size = 5) {
                this.size = size;
                this.startPos = { x: 0, y: 0 };
                this.goalPos = { x: size - 1, y: size - 1 };
                this.obstacles = this.generateObstacles();
                this.currentPos = { ...this.startPos };
            }
            
            // 生成障碍物
            generateObstacles() {
                const obstacles = [];
                const numObstacles = Math.floor(this.size * this.size * 0.15); // 15%的格子作为障碍物
                
                while (obstacles.length < numObstacles) {
                    const x = Math.floor(Math.random() * (this.size - 2)) + 1;
                    const y = Math.floor(Math.random() * (this.size - 2)) + 1;
                    
                    // 确保障碍物不会出现在起点或终点
                    if ((x !== this.startPos.x || y !== this.startPos.y) && 
                        (x !== this.goalPos.x || y !== this.goalPos.y)) {
                        obstacles.push({ x, y });
                    }
                }
                
                return obstacles;
            }
            
            // 重置环境
            reset() {
                this.currentPos = { ...this.startPos };
                return { ...this.currentPos };
            }
            
            // 执行动作并返回结果
            step(action) {
                const { x, y } = this.currentPos;
                let newX = x, newY = y;
                
                // 根据动作更新位置
                switch(action) {
                    case 0: // 上
                        newY = Math.max(0, y - 1);
                        break;
                    case 1: // 右
                        newX = Math.min(this.size - 1, x + 1);
                        break;
                    case 2: // 下
                        newY = Math.min(this.size - 1, y + 1);
                        break;
                    case 3: // 左
                        newX = Math.max(0, x - 1);
                        break;
                }
                
                // 检查是否碰到障碍物
                const isObstacle = this.obstacles.some(obs => obs.x === newX && obs.y === newY);
                
                if (isObstacle) {
                    // 如果碰到障碍物，留在原地并给予惩罚
                    return {
                        state: { ...this.currentPos },
                        reward: -10,
                        done: false
                    };
                }
                
                // 更新当前位置
                this.currentPos = { x: newX, y: newY };
                
                // 检查是否到达目标
                const isGoal = newX === this.goalPos.x && newY === this.goalPos.y;
                
                return {
                    state: { ...this.currentPos },
                    reward: isGoal ? 100 : -1,
                    done: isGoal
                };
            }
        }
        
        // Q-Learning智能体
        class QLearningAgent {
            constructor(stateSize, actionSize, learningRate = 0.1, discountFactor = 0.9, epsilon = 1.0, epsilonDecay = 0.995, epsilonMin = 0.01) {
                this.stateSize = stateSize;
                this.actionSize = actionSize;
                this.learningRate = learningRate;
                this.discountFactor = discountFactor;
                this.epsilon = epsilon;
                this.epsilonDecay = epsilonDecay;
                this.epsilonMin = epsilonMin;
                
                // 初始化Q表为全0
                this.qTable = Array(stateSize.x).fill().map(() => 
                    Array(stateSize.y).fill().map(() => 
                        Array(actionSize).fill(0)
                    )
                );
            }
            
            // 根据当前状态选择动作（ε-贪心策略）
            act(state) {
                if (Math.random() < this.epsilon) {
                    // 探索：随机选择动作
                    return Math.floor(Math.random() * this.actionSize);
                } else {
                    // 利用：选择Q值最大的动作
                    const { x, y } = state;
                    return this.getBestAction(x, y);
                }
            }
            
            // 获取给定状态下的最佳动作
            getBestAction(x, y) {
                const actions = this.qTable[x][y];
                let bestAction = 0;
                let bestValue = actions[0];
                
                for (let i = 1; i < actions.length; i++) {
                    if (actions[i] > bestValue) {
                        bestValue = actions[i];
                        bestAction = i;
                    }
                }
                
                return bestAction;
            }
            
            // 更新Q表
            update(state, action, reward, nextState, done) {
                const { x, y } = state;
                const { x: nextX, y: nextY } = nextState;
                
                // Q学习更新公式
                const currentQ = this.qTable[x][y][action];
                const maxNextQ = done ? 0 : Math.max(...this.qTable[nextX][nextY]);
                
                this.qTable[x][y][action] = currentQ + this.learningRate * (reward + this.discountFactor * maxNextQ - currentQ);
                
                // 衰减探索率
                if (this.epsilon > this.epsilonMin) {
                    this.epsilon *= this.epsilonDecay;
                }
            }
        }
        
        // 可视化管理器
        class VisualizationManager {
            constructor() {
                this.gridWorld = null;
                this.agent = null;
                this.isTraining = false;
                this.episodes = 100;
                this.currentEpisode = 0;
                this.rewardsHistory = [];
                this.stepsHistory = [];
                
                // 获取DOM元素
                this.gridSizeSlider = document.getElementById('gridSize');
                this.gridSizeValue = document.getElementById('gridSizeValue');
                this.learningRateSlider = document.getElementById('learningRate');
                this.learningRateValue = document.getElementById('learningRateValue');
                this.discountFactorSlider = document.getElementById('discountFactor');
                this.discountFactorValue = document.getElementById('discountFactorValue');
                this.epsilonSlider = document.getElementById('epsilon');
                this.epsilonValue = document.getElementById('epsilonValue');
                this.epsilonDecaySlider = document.getElementById('epsilonDecay');
                this.epsilonDecayValue = document.getElementById('epsilonDecayValue');
                this.episodesInput = document.getElementById('episodes');
                this.trainBtn = document.getElementById('trainBtn');
                this.resetBtn = document.getElementById('resetBtn');
                this.currentEpisodeEl = document.getElementById('currentEpisode');
                this.currentRewardEl = document.getElementById('currentReward');
                this.totalStepsEl = document.getElementById('totalSteps');
                this.currentEpsilonEl = document.getElementById('currentEpsilon');
                this.gridContainer = document.getElementById('gridContainer');
                this.qTableContainer = document.getElementById('qTableContainer');
                
                // 初始化图表
                this.rewardChart = this.initChart('rewardChart', '累积奖励', '蓝色');
                this.stepsChart = this.initChart('stepsChart', '步数', '绿色');
                
                // 设置事件监听器
                this.setupEventListeners();
                
                // 初始化环境和智能体
                this.resetSimulation();
            }
            
            // 初始化图表
            initChart(elementId, yLabel, color) {
                const ctx = document.getElementById(elementId).getContext('2d');
                const colorHex = color === '蓝色' ? '#3B82F6' : '#10B981';
                
                return new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: [],
                        datasets: [{
                            label: yLabel,
                            data: [],
                            borderColor: colorHex,
                            backgroundColor: `${colorHex}20`,
                            borderWidth: 2,
                            tension: 0.3,
                            fill: true
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        scales: {
                            x: {
                                title: {
                                    display: true,
                                    text: '回合'
                                }
                            },
                            y: {
                                title: {
                                    display: true,
                                    text: yLabel
                                }
                            }
                        },
                        animation: {
                            duration: 0
                        }
                    }
                });
            }
            
            // 设置事件监听器
            setupEventListeners() {
                // 滑块值变化事件
                this.gridSizeSlider.addEventListener('input', () => this.updateGridSize());
                this.learningRateSlider.addEventListener('input', () => this.updateLearningRate());
                this.discountFactorSlider.addEventListener('input', () => this.updateDiscountFactor());
                this.epsilonSlider.addEventListener('input', () => this.updateEpsilon());
                this.epsilonDecaySlider.addEventListener('input', () => this.updateEpsilonDecay());
                
                // 按钮点击事件
                this.trainBtn.addEventListener('click', () => this.toggleTraining());
                this.resetBtn.addEventListener('click', () => this.resetSimulation());
            }
            
            // 更新网格大小
            updateGridSize() {
                const size = parseInt(this.gridSizeSlider.value);
                this.gridSizeValue.textContent = `${size}×${size}`;
                
                if (!this.isTraining) {
                    this.resetSimulation();
                }
            }
            
            // 更新学习率
            updateLearningRate() {
                const rate = parseFloat(this.learningRateSlider.value).toFixed(2);
                this.learningRateValue.textContent = rate;
                
                if (this.agent) {
                    this.agent.learningRate = parseFloat(rate);
                }
            }
            
            // 更新折扣因子
            updateDiscountFactor() {
                const factor = parseFloat(this.discountFactorSlider.value).toFixed(2);
                this.discountFactorValue.textContent = factor;
                
                if (this.agent) {
                    this.agent.discountFactor = parseFloat(factor);
                }
            }
            
            // 更新探索率
            updateEpsilon() {
                const epsilon = parseFloat(this.epsilonSlider.value).toFixed(2);
                this.epsilonValue.textContent = epsilon;
                
                if (this.agent) {
                    this.agent.epsilon = parseFloat(epsilon);
                    this.updateStatusDisplay();
                }
            }
            
            // 更新探索衰减率
            updateEpsilonDecay() {
                const decay = parseFloat(this.epsilonDecaySlider.value).toFixed(3);
                this.epsilonDecayValue.textContent = decay;
                
                if (this.agent) {
                    this.agent.epsilonDecay = parseFloat(decay);
                }
            }
            
            // 切换训练状态
            toggleTraining() {
                if (this.isTraining) {
                    this.stopTraining();
                } else {
                    this.startTraining();
                }
            }
            
            // 开始训练
            startTraining() {
                this.isTraining = true;
                this.episodes = parseInt(this.episodesInput.value);
                this.trainBtn.innerHTML = '<i class="fa fa-pause mr-2"></i>暂停训练';
                this.trainBtn.classList.remove('bg-primary');
                this.trainBtn.classList.add('bg-amber-500');
                
                this.trainEpisode();
            }
            
            // 停止训练
            stopTraining() {
                this.isTraining = false;
                this.trainBtn.innerHTML = '<i class="fa fa-play mr-2"></i>开始训练';
                this.trainBtn.classList.remove('bg-amber-500');
                this.trainBtn.classList.add('bg-primary');
            }
            
            // 重置模拟
            resetSimulation() {
                this.stopTraining();
                
                const size = parseInt(this.gridSizeSlider.value);
                const learningRate = parseFloat(this.learningRateSlider.value);
                const discountFactor = parseFloat(this.discountFactorSlider.value);
                const epsilon = parseFloat(this.epsilonSlider.value);
                const epsilonDecay = parseFloat(this.epsilonDecaySlider.value);
                
                // 创建新的环境和智能体
                this.gridWorld = new GridWorld(size);
                this.agent = new QLearningAgent(
                    { x: size, y: size },
                    4, // 上右下左
                    learningRate,
                    discountFactor,
                    epsilon,
                    epsilonDecay
                );
                
                // 重置训练状态
                this.currentEpisode = 0;
                this.rewardsHistory = [];
                this.stepsHistory = [];
                
                // 更新显示
                this.updateGridDisplay();
                this.updateQTableDisplay();
                this.updateChartData();
                this.updateStatusDisplay();
            }
            
            // 训练一个回合
            async trainEpisode() {
                if (!this.isTraining || this.currentEpisode >= this.episodes) {
                    this.stopTraining();
                    return;
                }
                
                this.currentEpisode++;
                const state = this.gridWorld.reset();
                let done = false;
                let totalReward = 0;
                let steps = 0;
                
                // 更新状态显示
                this.updateStatusDisplay();
                
                while (!done) {
                    const action = this.agent.act(state);
                    const { state: nextState, reward, done: isDone } = this.gridWorld.step(action);
                    
                    // 更新Q表
                    this.agent.update(state, action, reward, nextState, isDone);
                    
                    // 更新显示
                    this.updateGridDisplay();
                    this.updateQTableDisplay();
                    
                    // 累加奖励和步数
                    totalReward += reward;
                    steps++;
                    
                    // 移动到下一个状态
                    state = nextState;
                    
                    // 等待一小段时间以便观察
                    await new Promise(resolve => setTimeout(resolve, 50));
                }
                
                // 记录本轮的奖励和步数
                this.rewardsHistory.push(totalReward);
                this.stepsHistory.push(steps);
                
                // 更新图表
                this.updateChartData();
                
                // 更新状态显示
                this.currentRewardEl.textContent = totalReward;
                this.totalStepsEl.textContent = steps;
                
                // 继续下一个回合
                requestAnimationFrame(() => this.trainEpisode());
            }
            
            // 更新网格显示
            updateGridDisplay() {
                const size = this.gridWorld.size;
                const cellSize = Math.min(60, 400 / size); // 单元格大小，最大60px，根据网格大小自适应
                
                this.gridContainer.innerHTML = '';
                this.gridContainer.style.width = `${cellSize * size}px`;
                this.gridContainer.style.height = `${cellSize * size}px`;
                
                // 创建网格
                const grid = document.createElement('div');
                grid.className = 'grid grid-cols-[repeat(auto-fill,minmax(0,1fr))] gap-1';
                grid.style.gridTemplateColumns = `repeat(${size}, ${cellSize}px)`;
                grid.style.gridTemplateRows = `repeat(${size}, ${cellSize}px)`;
                
                // 填充单元格
                for (let y = 0; y < size; y++) {
                    for (let x = 0; x < size; x++) {
                        const cell = document.createElement('div');
                        cell.className = 'flex items-center justify-center rounded-lg cell-hover';
                        
                        // 设置单元格样式
                        if (x === this.gridWorld.startPos.x && y === this.gridWorld.startPos.y) {
                            cell.classList.add('bg-gray-200');
                            cell.innerHTML = '<i class="fa fa-flag text-gray-600"></i>';
                        } else if (x === this.gridWorld.goalPos.x && y === this.gridWorld.goalPos.y) {
                            cell.classList.add('bg-goal/20', 'border-2', 'border-goal');
                            cell.innerHTML = '<i class="fa fa-star text-goal"></i>';
                        } else if (this.gridWorld.obstacles.some(obs => obs.x === x && obs.y === y)) {
                            cell.classList.add('bg-obstacle/20', 'border-2', 'border-obstacle');
                            cell.innerHTML = '<i class="fa fa-ban text-obstacle"></i>';
                        } else {
                            cell.classList.add('bg-white', 'border', 'border-gray-200');
                            
                            // 显示该位置的最佳动作
                            const bestAction = this.agent.getBestAction(x, y);
                            const arrows = ['↑', '→', '↓', '←'];
                            cell.innerHTML = `<span class="text-gray-500">${arrows[bestAction]}</span>`;
                        }
                        
                        // 如果是当前智能体位置，添加智能体图标
                        if (x === this.gridWorld.currentPos.x && y === this.gridWorld.currentPos.y) {
                            cell.classList.add('bg-agent/20', 'border-2', 'border-agent');
                            cell.innerHTML = '<i class="fa fa-user text-agent"></i>';
                        }
                        
                        grid.appendChild(cell);
                    }
                }
                
                this.gridContainer.appendChild(grid);
            }
            
            // 更新Q表显示
            updateQTableDisplay() {
                const size = this.gridWorld.size;
                
                this.qTableContainer.innerHTML = '';
                
                // 创建表格
                const table = document.createElement('table');
                table.className = 'min-w-full divide-y divide-gray-200';
                
                // 创建表头
                const thead = document.createElement('thead');
                thead.className = 'bg-gray-50';
                const headerRow = document.createElement('tr');
                
                // 添加坐标列
                const coordHeader = document.createElement('th');
                coordHeader.scope = 'col';
                coordHeader.className = 'px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider';
                coordHeader.textContent = '坐标';
                headerRow.appendChild(coordHeader);
                
                // 添加动作列
                const actions = ['上 (↑)', '右 (→)', '下 (↓)', '左 (←)'];
                actions.forEach(action => {
                    const th = document.createElement('th');
                    th.scope = 'col';
                    th.className = 'px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider';
                    th.textContent = action;
                    headerRow.appendChild(th);
                });
                
                thead.appendChild(headerRow);
                table.appendChild(thead);
                
                // 创建表格主体
                const tbody = document.createElement('tbody');
                tbody.className = 'bg-white divide-y divide-gray-200';
                
                // 填充表格数据
                for (let y = 0; y < size; y++) {
                    for (let x = 0; x < size; x++) {
                        const tr = document.createElement('tr');
                        
                        // 添加坐标单元格
                        const coordCell = document.createElement('td');
                        coordCell.className = 'px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900';
                        coordCell.textContent = `(${x}, ${y})`;
                        tr.appendChild(coordCell);
                        
                        // 添加Q值单元格
                        const qValues = this.agent.qTable[x][y];
                        qValues.forEach((qValue, actionIndex) => {
                            const td = document.createElement('td');
                            td.className = 'px-6 py-4 whitespace-nowrap text-sm text-gray-500';
                            
                            // 根据Q值大小设置颜色和粗细
                            if (qValue === Math.max(...qValues)) {
                                td.classList.add('font-medium', 'text-primary');
                            }
                            
                            td.textContent = qValue.toFixed(2);
                            tr.appendChild(td);
                        });
                        
                        tbody.appendChild(tr);
                    }
                }
                
                table.appendChild(tbody);
                this.qTableContainer.appendChild(table);
            }
            
            // 更新图表数据
            updateChartData() {
                const episodes = Array.from({ length: this.currentEpisode }, (_, i) => i + 1);
                
                // 更新奖励图表
                this.rewardChart.data.labels = episodes;
                this.rewardChart.data.datasets[0].data = this.rewardsHistory;
                this.rewardChart.update();
                
                // 更新步数图表
                this.stepsChart.data.labels = episodes;
                this.stepsChart.data.datasets[0].data = this.stepsHistory;
                this.stepsChart.update();
            }
            
            // 更新状态显示
            updateStatusDisplay() {
                this.currentEpisodeEl.textContent = this.currentEpisode;
                this.currentEpsilonEl.textContent = this.agent.epsilon.toFixed(2);
            }
        }
        
        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', () => {
            new VisualizationManager();
        });
    </script>
</body>
</html>
